<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script src="../assets/scripts/registro.js" defer></script>
  </head>
  <body>
    <h2>Registro de Usuario</h2>
    <form id="registroForm">
      <fieldset>
        <label for="nombre">Nombre y Apellido:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required />

        <label>
          <input type="checkbox" id="admin" name="admin" />
          Cuenta administrador
        </label>

        <button type="submit">Registrarse</button>
      </fieldset>
    </form>

    <p id="avisos"></p>
    <br />
    <p>¿Ya tienes cuenta? <a href="../index.html">Inicia sesión</a></p>

    <footer>
      <p>Segunda entrega JavaScript</p>
      <p><strong>Nombre y Apellido: </strong>Leandro Soloducha</p>
      <p><strong>Comision: </strong>80845</p>
    </footer>
  </body>
</html>
