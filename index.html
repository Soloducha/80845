<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tienda de Muebles</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/scripts/muebles.js" defer></script>
    <script src="assets/scripts/login.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="titulo-principal">Tienda de Muebles</h1>
      <div id="bienvenida" class="bienvenida">
        <!-- Mensaje de bienvenida y botón Sign Out -->
      </div>
    </header>

    <main>
      <section class="login">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <fieldset>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <br /><br />
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required />
            <br /><br />
            <button type="submit">Ingresar</button>
            <br /><br />
            <span
              >¿No tienes cuenta?
              <a href="/pages/registro.html">Regístrate</a></span
            >
          </fieldset>
        </form>
        <p id="avisos"></p>
      </section>
    </main>

    <footer>
      <p>Segunda entrega JavaScript</p>
      <p><strong>Nombre y Apellido: </strong>Leandro Soloducha</p>
      <p><strong>Comisión: </strong>80845</p>
    </footer>
  </body>
</html>
